server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # 底图改走独立服务 zhian-tiles :5099，本容器不再挂瓦片。
    # 明确返回 404，绝不能落到下面的 SPA 回退变成 200 的 index.html——
    # 否则浏览器把 HTML 当 PNG 解析，tileerror 计数和故障提示条全部失灵，
    # 表现就是「地图一片黑、控制台干净、没人知道为什么」。
    location /tiles/ {
        return 404;
    }

    # 2. 带内容 hash 的构建产物（文件名变就是内容变），可以放心长缓存；
    #    找不到的文件要真 404，不回退 index.html，否则旧页面引用的
    #    已删除 JS 会拿到 HTML 当 JS 执行，白屏且报错莫名其妙。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 字体文件名稳定、内容不变，同样长缓存 + 真 404
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 3. 运行时配置：挂载进容器、改完要立刻生效的三个 JSON，
    #    禁止强缓存，每次都回源验证（ETag 命中返回 304，省流量但不会吃旧数据）。
    location ~ ^/(map-config|incidents|case_type_config)\.json$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 1. 部署 React 前端页面。SPA 路由回退只保留给这里（页面路由），
    #    不作用于上面已单独处理的静态资源目录。
    #    index.html 同样禁止强缓存——它是入口文件，缓存住就等于用户
    #    永远拿不到新版本，必须手动强刷才能看见更新。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
