server {
    listen       80;
    server_name  localhost;

    # 1. 部署 React 前端页面
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 底图改走独立服务 zhian-tiles :5099，本容器不再挂瓦片

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
